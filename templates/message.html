<%fn message(a: Allocator, inout out: Buf(u8), m: model.MessageView, room_name: []u8) %>

  <div id="message_<%= m.client_id %>" class="message <% if (m.all_emoji) { %>message--emoji<% } %>" data-controller="reply" data-user-id="<%d m.creator.id %>" data-message-id="<%d m.id %>" data-message-timestamp="<%d tf.epoch_ms(m.created_ns) %>" data-message-updated-at="<%d tf.epoch_ms(m.updated_ns) %>" data-sort-value="<%d tf.epoch_ms(m.created_ns) %>" data-messages-target="message" data-search-results-target="message" data-refresh-room-target="message" data-reply-composer-outlet="#composer">
    <h2 class="message__day-separator"><time datetime="<% tf.iso8601(a, &out, m.created_ns) %>" data-local-time-target="date"></time></h2>

    <figure class="avatar message__avatar">
      <a title="<%= m.creator.title %>" class="btn avatar" data-turbo-frame="_top" href="/users/<%d m.creator.id %>"><img aria-hidden="true" src="<%= m.creator.avatar %>" width="48" height="48" /></a>
    </figure>

    <turbo-frame id="edit_message_<%= m.client_id %>">
      <div class="message__body">
        <div class="message__body-content">
          <div class="message__meta">
            <h3 class="message__heading">
              <span class="message__author" title="<%= m.creator.title %>">
                <strong data-reply-target="author"><%= m.creator.name %></strong>
              </span>
              <a target="_top" class="message__permalink" href="/rooms/<%d m.room_id %>/@<%d m.id %>"><time class="message__timestamp" datetime="<% tf.iso8601(a, &out, m.created_ns) %>" data-local-time-target="time"></time></a>
              <span class="message__room">
                <a target="_top" data-reply-target="link" href="/rooms/<%d m.room_id %>/@<%d m.id %>"><%= room_name %></a>
              </span>
            </h3>
            <div class="message__actions" data-controller="soft-keyboard">
  <details class="position-relative" data-controller="popup" data-action="keydown.esc-&gt;popup#close toggle-&gt;popup#toggle click@document-&gt;popup#closeOnClickOutside" data-popup-orientation-top-class="popup-orientation-top">
    <summary class="btn message__action-btn message__options-btn">
      <img class="colorize--black" aria-hidden="true" src="/assets/menu-dots-horizontal-f6a5d793.svg" width="20" height="20" />
      <span class="for-screen-reader">Message options</span>
    </summary>

    <div class="message__actions-menu border shadow" data-popup-target="menu">
      <div class="quick-boosts"><% quick_boosts(a, &out, m) %>

        <a class="btn message__action-btn message__boost-btn" data-turbo-frame="new_boost_message_<%= m.client_id %>" data-action="soft-keyboard#open popup#close" href="/messages/<%d m.id %>/boosts/new">
          <img class="colorize--black" aria-hidden="true" src="/assets/boost-4a7bab66.svg" width="20" height="20" />
          <span class="for-screen-reader">New boost</span>
</a>      </div>

      <div class="flex flex-wrap border-top margin-block-start-half pad-block-start-half message__actions-grid">
          <button class="btn message__action-btn center full-width" data-action="reply#reply" title="Reply" aria-label="Reply">
            <img class="colorize--black" aria-hidden="true" src="/assets/reply-edb77e33.svg" width="20" height="20" />
</button>

        <button class="btn message__action-btn center full-width" title="Copy link" aria-label="Copy link" data-controller="copy-to-clipboard" data-action="copy-to-clipboard#copy" data-copy-to-clipboard-success-class="btn--success" data-copy-to-clipboard-url-value="/rooms/<%d m.room_id %>/@<%d m.id %>">
          <img class="colorize--black" aria-hidden="true" src="/assets/link-e546a5df.svg" width="20" height="20" />
</button>
        <a class="btn message__action-btn center full-width message__edit-btn" data-turbo-frame="edit_message_<%= m.client_id %>" title="Edit" aria-label="Edit" href="/rooms/<%d m.room_id %>/messages/<%d m.id %>/edit">
          <img class="colorize--black" aria-hidden="true" src="/assets/pencil-cf9d28aa.svg" width="20" height="20" />
</a>      </div>
    </div>
</details></div>
          </div>
          <div id="presentation_message_<%= m.client_id %>" dir="auto" data-reply-target="body" data-messages-target="body">
  <div class="lexxy-content">
  <%- m.body %>
</div>

</div>
          <turbo-frame id="boosting_message_<%= m.client_id %>">
  <div class="boosts flex flex-wrap align-center gap full-width" style="--column-gap: 0.4ch; --row-gap: 0"
      data-controller="turbo-streaming" data-action="turbo:submit-start->turbo-streaming#unsubscribe">
    <div class="flex-inline flex-wrap gap" id="boosts_message_<%= m.client_id %>" data-turbo-streaming-target="container"><% for (m.boosts) |b| { %><% boost(a, &out, b, m.id) %><% } %>
    </div>

    <turbo-frame id="new_boost_message_<%= m.client_id %>">
      <div class="flex-inline message__boost-inline" data-controller="soft-keyboard">
        <a class="boost__action txt-small btn" action="soft-keyboard#open" href="/messages/<%d m.id %>/boosts/new">
          <img aria-hidden="true" src="/assets/boost-4a7bab66.svg" width="20" height="20" />
          <span class="for-screen-reader">Add a boost</span>
</a>      </div>
</turbo-frame>  </div>
</turbo-frame>
        </div>
      </div>
    </turbo-frame>
</div>
