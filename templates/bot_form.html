<%fn bot_form(a: Allocator, inout out: Buf(u8), id: i64, name: []u8, webhook: []u8) %>
<section class="panel"><form class="flex flex-column gap" action="/account/bots<% if (id > 0) { %>/<%d id %><% } %>" method="post"><% if (id > 0) { %><input type="hidden" name="_method" value="patch" /><% } %>
  <h1 class="for-screen-reader">Chat Bot Setup</h1>
  <label class="flex align-center gap flex-item-grow txt-large input input--actor"><input class="input" autocomplete="name" placeholder="Name the bot" autofocus="autofocus" required="required" type="text" name="user[name]" value="<%= name %>" /></label>
  <label class="flex align-center gap flex-item-grow txt-large input input--actor"><input class="input" placeholder="Webhook URL" type="url" name="user[webhook_url]" value="<%= webhook %>" /></label>
  <button class="btn btn--reversed center txt-large" type="submit"><img aria-hidden="true" src="/assets/check-7897ff7e.svg" width="20" height="20" /><span class="for-screen-reader">Save changes</span></button>
</form></section>
