<%fn profile_membership(a: Allocator, inout out: Buf(u8), room_id: i64, name: []u8, param_key: []u8, direct: bool, involvement: []u8) %>
<li class="flex align-center gap margin-none min-width membership-item">
  <a class="overflow-ellipsis fill-shade txt-primary txt-undecorated" href="/rooms/<%d room_id %>">
    <strong><%= name %></strong>
</a>
  <hr class="separator" aria-hidden="true">

  <span class="txt-small">
    <turbo-frame id="involvement_<%- param_key %>_<%d room_id %>">
      <%: involvement_button(a, &out, room_id, param_key, direct, involvement) %>
</turbo-frame>  </span>
</li>
