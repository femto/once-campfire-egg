<%fn involvement_button(a: Allocator, inout out: Buf(u8), room_id: i64, param_key: []u8, direct: bool, involvement: []u8) %>
<form class="button_to" method="post" action="/rooms/<%d room_id %>/involvement?involvement=<%- next_involvement(direct, involvement) %>"><input type="hidden" name="_method" value="put" /><button role="checkbox" aria-checked="true" aria-labelledby="involvement_label_<%- param_key %>_<%d room_id %>" tabindex="0" class="btn <%= involvement %>" type="submit"><img aria-hidden="true" src="<%- bell_asset(involvement) %>" width="20" height="20" /><span class="for-screen-reader" id="involvement_label_<%- param_key %>_<%d room_id %>"><%- humanize_involvement(involvement) %></span></button></form>
