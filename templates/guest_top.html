<%fn guest_top(a: Allocator, inout out: Buf(u8), title: []u8, vapid: []u8, logo: []u8) %>
<!DOCTYPE html>
<html>
  <head>
    <title><%= title %></title>

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=resizes-content">
    <meta name="view-transition" content="same-origin">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <meta name="action-cable-url" content="/cable">

    <meta name="vapid-public-key" content="<%= vapid %>">
    <meta name="turbo-prefetch" content="true">

    <link rel="manifest" href="/webmanifest.json">
    <link rel="icon" href="<%- logo %>" type="image/png">
    <link rel="apple-touch-icon" href="<%- logo %>">

    <%- static_head.ASSETS %>
