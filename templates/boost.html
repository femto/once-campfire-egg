<%fn boost(a: Allocator, inout out: Buf(u8), b: model.BoostView, message_id: i64) %>

      <div id="boost_<%d b.id %>"
      class="boost boost-item flex-inline postion--relative max-width align-center fill-white gap"
      data-controller="boost-delete" data-boost-delete-perform-class="boost--deleting" data-boost-delete-reveal-class="expanded" data-boost-delete-booster-id-value="<%d b.booster.id %>">
    <figure class="avatar boost__avatar flex-item-no-shrink">
      <a title="<%= b.booster.title %>" class="btn avatar" data-turbo-frame="_top" href="/users/<%d b.booster.id %>"><img aria-label="<%= b.booster.name %> boosted <%= b.content %>" src="<%= b.booster.avatar %>" width="48" height="48" /></a>
    </figure>

    <span role="button" class="txt-small<% if (b.all_emoji) { %> txt-medium<% } %>" data-action="click-&gt;boost-delete#reveal keydown.enter-&gt;boost-delete#reveal:prevent" data-boost-delete-target="content"><%= b.content %></span>

    <form class="button_to" method="post" action="/messages/<%d message_id %>/boosts/<%d b.id %>"><input type="hidden" name="_method" value="delete" /><button data-action="boost-delete#perform" data-boost-delete-target="button" class="btn btn--negative flex-item-justify-end boost__delete" type="submit">
      <img aria-hidden="true" src="/assets/minus-b31a1093.svg" width="20" height="20" />
      <span class="for-screen-reader">Delete this boost</span>
</button></form>  </div>
  <span id="delete_boost_accessible_label" class="for-screen-reader">Press enter to delete this boost</span>
