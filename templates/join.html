<%fn join_page(a: Allocator, inout out: Buf(u8), code: []u8, account: []u8) %>
<!DOCTYPE html><html><head><title>Join Campfire</title><meta name="viewport" content="width=device-width, initial-scale=1" /><%- static_head.ASSETS %></head><body data-controller="local-time lightbox">
  <main id="main-content"><form action="/join/<%= code %>" method="post" class="center"><section class="nametag u-relative"><div class="nametag__inner flex flex-column gap">
    <fieldset><legend><img src="/account/logo" alt="" width="48" height="48" /><strong class="txt-large"><%= account %></strong></legend></fieldset>
    <label class="flex align-center gap flex-item-grow txt-large input input--actor"><input class="input" autocomplete="name" placeholder="Name" autofocus="autofocus" required="required" type="text" name="user[name]" /></label>
    <label class="flex align-center gap flex-item-grow txt-large input input--actor"><input class="input" autocomplete="username" placeholder="Email address" required="required" type="email" name="user[email_address]" /></label>
    <label class="flex align-center gap flex-item-grow txt-large input input--actor"><input class="input" autocomplete="new-password" placeholder="Password" required="required" maxlength="72" type="password" name="user[password]" /></label>
    <button class="btn btn--reversed center txt-large" type="submit"><img aria-hidden="true" src="/assets/check-7897ff7e.svg" /><span class="for-screen-reader">Save</span></button>
  </div></section></form></main>
</body></html>
