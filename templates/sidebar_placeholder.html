<%fn sidebar_placeholder(a: Allocator, inout out: Buf(u8), u: model.UserView) %>
<form class="button_to" method="post" action="/rooms/directs?user_ids%5B%5D=<%d u.id %>"><button class="direct borderless fill-transparent unpad" type="submit">
  <span class="avatar">
    <img aria-hidden="true" src="<%= u.avatar %>" />
  </span>

  <span class="direct__author flex align-center gap max-width min-width border-radius txt-small">
    <span class="txt-nowrap overflow-ellipsis">
      <span class="for-screen-reader">Start a ping with</span>
      <%: first_name(a, &out, u.name) %>
    </span>
  </span>
</button></form>
